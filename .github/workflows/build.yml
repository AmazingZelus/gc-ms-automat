# Builds the portable Windows ZIP, tests it, and publishes it on version tags.
#   push to main / pull request -> tests + build + smoke test (ZIP as workflow artifact)
#   push of a tag like v0.1.0   -> the same + GitHub Release with the ZIP attached
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      # This gets the code.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # the build never needs to push anything

      # This installs the same Python minor version as the portable one (3.14).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # This reads the version from app/gcms_automat/__init__.py (single source).
      - name: Read version
        id: version
        run: |
          $v = python tools/build_portable.py --print-version
          if (-not $v) { throw "version not found" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # This stops a release whose tag does not match the version in the code.
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG -ne "v$($env:VERSION)") { throw "Tag $($env:TAG) does not match version v$($env:VERSION)" }

      # This runs the unit tests on Windows with the exact locked libraries.
      - name: Unit tests
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/runtime.lock.txt
          python -m pip install --disable-pip-version-check pytest==9.2.0
          python -m pytest -q

      # This builds the portable ZIP.
      - name: Build portable ZIP
        run: python tools/build_portable.py

      # This extracts the ZIP into a tricky folder and checks start, export and shutdown.
      - name: Smoke test
        run: |
          $zip = (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName
          ./tools/smoke_test.ps1 -ZipPath $zip -ExpectedVersion "${{ steps.version.outputs.version }}"

      # This writes a SHA-256 checksum next to the ZIP (users can verify the download).
      - name: Checksum
        run: |
          Get-ChildItem dist/*.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$h  $($_.Name)"
          }

      # This keeps the ZIP as a downloadable workflow artifact (also for non-tag builds).
      - uses: actions/upload-artifact@v6
        with:
          name: GC-MS-Automat-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  # This job has write access, so it runs no third-party code: it only downloads
  # the tested ZIP and (for version tags) publishes it. On other pushes it only
  # checks that the artifact can be downloaded, so the release path is tested too.
  release:
    needs: build-windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -l dist && test -n "$(ls dist/*.zip)" && test -n "$(ls dist/*.sha256)"

      # This creates the GitHub Release (only for tags like v0.1.0); re-running
      # the workflow re-uploads the files instead of failing.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          hash=$(cut -d' ' -f1 dist/*.sha256)
          printf '%s\n\n%s\n' \
            "Přenosná verze pro Windows (64bit). Stáhněte ZIP, rozbalte (Extrahovat vše) a spusťte spustit.bat. Podrobný návod je v README." \
            "SHA-256 ZIPu: \`${hash}\`" > notes.md
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.sha256 --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md   # keep the hash in sync
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 --repo "$REPO" \
              --title "GC-MS Automat $TAG" --notes-file notes.md
          fi
